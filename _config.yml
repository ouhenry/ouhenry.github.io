title: 跬步 · Henry 的学习手记
short_title: 跬步
author: Henry
email: huangcsdn@163.com
description: 记录代码、知识与生活中的小小进步。关于数据结构、移动开发、工程实践，以及保持学习的日常。
url: "https://ouhenry.github.io"
baseurl: ""
lang: zh-CN
timezone: Asia/Shanghai
github_username: ouhenry
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title.html
plugins:
  - jekyll-feed
kramdown:
  input: GFM
  syntax_highlighter: rouge
  auto_ids: true
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Henry
  - scope:
      path: ""
    values:
      layout: page
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .bundle
  - scripts
  - README.md
  - LICENSE
  - node_modules
